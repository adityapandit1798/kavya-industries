services:
  backend:
    build: .
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    container_name: backend
    ports:
      - '3000:3000'
    environment:
      - SERVICE=backend
      - NODE_ENV=docker
      - DB_DIRECTORY=/data
      - PORT=3000
      - DEV_SERVER_URL=0.0.0.0
      - FE_SERVER_URL=http://localhost:3001
      - MIGRATIONS_PATH=/app/dist-be/backend/server/shared/migrations
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net=require('net');const c=net.createConnection(3000,'localhost');c.on('connect',()=>{c.destroy();process.exit(0)});c.on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: .
    container_name: frontend
    ports:
      - '3001:3001'
    environment:
      - SERVICE=frontend
      - BACKEND_HOST=backend
      - BACKEND_PORT=3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
